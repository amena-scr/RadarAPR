<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadarAPR - Inteligencia Salarial</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* ESTILOS RESPONSIVOS GARANTIZADOS */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        .seccion-titulo {
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        .btn-principal {
            background-color: #27ae60;
            color: white;
            margin-top: 20px;
        }
        .btn-avanzados {
            background-color: #e8f4fd;
            color: #2980b9;
            border: 1px solid #2980b9;
        }
        .banderas-box {
            background: #fff3cd;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ffeeba;
        }
        .checkbox-item {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .checkbox-item input {
            margin-top: 3px;
            width: auto;
        }
        /* Ajustes para móviles */
        @media (max-width: 480px) {
            .container { padding: 15px; }
            h1 { font-size: 1.5rem; }
            .subtitle { font-size: 0.9rem; }
            .input-group-duracion { flex-direction: column; gap: 0 !important; }
            .input-group-duracion select { margin-top: 5px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 20px;">
            <h1 style="color: #2c3e50; margin-bottom: 5px;">RadarAPR 📡</h1>
            <p class="subtitle" style="color: #7f8c8d; margin-top: 0;">Estima el sueldo de una oferta laboral y prepárate para negociar</p>
        </header>

        <main id="app-form">
            <label>Nivel de Formación:</label>
            <select id="formacion">
                <option value="tecnico">Técnico en Prevención</option>
                <option value="ingeniero">Ingeniero en Prevención</option>
            </select>

            <label>Región del Cargo:</label>
            <select id="region">
                <option value="arica">XV - Arica y Parinacota</option>
                <option value="tarapaca">I - Tarapacá</option>
                <option value="antofagasta">II - Antofagasta</option>
                <option value="metropolitana" selected>RM - Región Metropolitana</option>
                <option value="valparaiso">V - Valparaíso</option>
                </select>

            <label>Ciudad Específica:</label>
            <select id="ciudad">
                <option value="" selected>Seleccione una ciudad (Opcional)</option>
            </select>

            <label>Sueldo Líquido Ofrecido ($):</label>
            <input type="number" id="sueldo_ofrecido" placeholder="Ej: 950000">

            <button type="button" class="btn-avanzados" onclick="toggleAvanzados()" style="display: flex; justify-content: flex-start; align-items: center; gap: 8px;">
                <span id="icon-avanzados">⚙️</span> Configuración Avanzada y Red Flags
            </button>

            <div id="seccion_avanzada" style="display: none; margin-top: 15px;">

                <div class="seccion-titulo">Sector Económico</div>
                <select id="rubro">
                    <option value="" selected disabled>-- Seleccione una opción --</option>
                    <option value="mineria_cielo_abierto">Minería a Cielo Abierto</option>
                    <option value="obras_civiles">Obras Civiles y Construcción</option>
                    <option value="comercio_retail">Comercio Retail y Servicios</option>
                    <option value="salud_educacion">Salud y Educación</option>
                </select>

                <div class="seccion-titulo">Experiencia del Postulante</div>
                <select id="experiencia">
                    <option value="" selected disabled>-- Seleccione una opción --</option>
                    <option value="junior">0 a 2 años (Junior)</option>
                    <option value="semi_senior">3 a 5 años (Semi-Senior)</option>
                    <option value="senior">Más de 5 años (Senior)</option>
                </select>

                <div class="seccion-titulo">Tipo de Contrato</div>
                <select id="tipo_contrato">
                    <option value="" selected disabled>-- Seleccione una opción --</option>
                    <option value="indefinido">Contrato Indefinido</option>
                    <option value="plazo_fijo">Contrato a Plazo Fijo</option>
                    <option value="obra_faena">Contrato por Obra o Faena</option>
                    <option value="honorarios">Prestación de Servicios (Honorarios)</option>
                </select>

                <div class="seccion-titulo">Duración del Servicio a Prestar</div>
                <div class="input-group-duracion" style="display: flex; gap: 10px;">
                    <input type="number" id="cantidad_duracion" value="1" min="1" placeholder="Ej: 1" style="flex: 1; margin-bottom: 0;">
                    <select id="unidad_duracion" style="flex: 2; margin-bottom: 0;">
                        <option value="indefinida" selected>Indefinida (Contrato mensual normal)</option>
                        <option value="horas">Hora(s)</option>
                        <option value="dias">Día(s)</option>
                        <option value="semanas">Semana(s)</option>
                        <option value="meses">Mes(es)</option>
                        <option value="anos">Año(s)</option>
                    </select>
                </div>
                <p style="font-size: 0.75rem; color: #7f8c8d; margin-top: 5px;">*El cálculo total se ajustará al tiempo ingresado.</p>

                <div class="seccion-titulo">Jornada y Turnos</div>
                <select id="turno">
                    <option value="" selected disabled>-- Seleccione una opción --</option>
                    <option value="lunes_viernes_normal">Lunes a Viernes (Horario Normal)</option>
                    <option value="turno_7x7">Turno 7x7 (Faena)</option>
                    <option value="turno_nocturno">Turno Nocturno Fijo</option>
                </select>

                <div class="seccion-titulo">Modalidad y Zona</div>
                <select id="modalidad">
                    <option value="" selected disabled>-- Seleccione una opción --</option>
                    <option value="oficina">100% Oficina / Administrativo</option>
                    <option value="terreno">100% Terreno / Faena</option>
                </select>

                <div class="seccion-titulo" style="color: #c0392b;">Escáner de Banderas Rojas 🚩</div>
                <div class="banderas-box">
                    <div class="checkbox-item"><input type="checkbox" id="tarea_bodega"><label for="tarea_bodega">Administrar bodega o materiales</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="tarea_rrhh"><label for="tarea_rrhh">Control de asistencia o remuneraciones</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="tarea_logistica"><label for="tarea_logistica">Coordinación logística o despachos</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="tarea_contabilidad"><label for="tarea_contabilidad">Funciones contables o finanzas</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="tarea_conduccion"><label for="tarea_conduccion">Conducir vehículos empresa</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="tarea_supervision_op"><label for="tarea_supervision_op">Supervisión de operación</label></div>
                </div>
            </div>

            <button type="button" class="btn-principal" onclick="evaluarOferta()">Analizar Oferta</button>
        </main>

        <section id="resultado_analisis" style="display: none;"></section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_client.js.obfuscated.js"></script>
    <script src="app.js.obfuscated.js"></script>
    <script src="mapa.js.obfuscated.js"></script>
</body>
</html>
