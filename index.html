<html lang="es">

<head>

    <title>RadarAPR - Inteligencia Salarial</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        .seccion-titulo {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 0.95rem;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 5px;
        }
        .input-group-duracion { display: flex; gap: 10px; align-items: center; }
        .input-group-duracion input[type="number"] { width: 80px; text-align: center; margin-bottom: 0; }
        .input-group-duracion select { flex: 1; margin-bottom: 0; }

        @media (max-width: 480px) {
            .input-group-duracion { gap: 8px; }
            .input-group-duracion input[type="number"] { width: 70px; }
        }
    </style>
</head>

<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TXFLK95L" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div class="container">
        <header>
            <h1 style="color: #2c3e50;">Radar<span style="font-size: 0.8em; color: #e74c3c;">APR</span> 📡</h1>
            <p class="subtitle">Estima el sueldo de una oferta laboral y te prepara para negociar la entrevista</p>
        </header>

        <main id="app-form">

            <label class="seccion-titulo" style="margin-top: 0;">Sueldo Líquido Ofrecido ($):</label>
            <input type="number" id="sueldo_ofrecido" placeholder="Ej: 950000" style="border: 2px solid #2980b9; background: #f0f8ff;">

            <label class="seccion-titulo">Nivel de formación requerida</label>
            <select id="formacion">
                <option value="" selected disabled>-- Seleccione una opción --</option>
                <option value="tecnico">Técnico en Prevención</option>
                <option value="ingeniero">Ingeniero en Prevención</option>
            </select>

            <label class="seccion-titulo">Experiencia requerida</label>
            <select id="experiencia">
                <option value="" selected disabled>-- Seleccione una opción --</option>
                <option value="junior">0 a 2 años (Junior)</option>
                <option value="semi_senior">3 a 5 años (Semi-Senior)</option>
                <option value="senior">Más de 5 años (Senior)</option>
            </select>

            <label class="seccion-titulo">Certificaciones y Experiencia Minera</label>
            <select id="especializacion">
                <option value="" selected disabled>-- Certificación / Resolución --</option>
                <option value="ninguna">Sin resolución específica</option>
                <option value="sns">Resolución Seremi Salud (SNS)</option>
                <option value="auditor">Auditor Trinorma (ISO 45001/14001/9001)</option>
                <option value="sernageomin_c">Experto Sernageomin C</option>
                <option value="sernageomin_b">Experto Sernageomin B</option>
                <option value="sernageomin_a">Experto Sernageomin A</option>
            </select>
            <select id="exp_mineria" style="margin-top: 5px;">
                <option value="" selected disabled>-- Experiencia en Minería --</option>
                <option value="sin_experiencia">Sin experiencia en minería</option>
                <option value="pequena_mineria">Experiencia en Pequeña Minería / Canteras</option>
                <option value="mediana_mineria">Experiencia en Mediana Minería</option>
                <option value="gran_mineria">Experiencia en Gran Minería (Cobre/Litio)</option>
            </select>

            <label class="seccion-titulo">Región de la oferta</label>
            <select id="region">
                <option value="" selected disabled>-- Seleccione una región --</option>
                <option value="arica">XV - Arica y Parinacota</option>
                <option value="tarapaca">I - Tarapacá</option>
                <option value="antofagasta">II - Antofagasta</option>
                <option value="atacama">III - Atacama</option>
                <option value="coquimbo">IV - Coquimbo</option>
                <option value="valparaiso">V - Valparaíso</option>
                <option value="metropolitana">RM - Región Metropolitana</option>
                <option value="ohiggins">VI - O'Higgins</option>
                <option value="maule">VII - Maule</option>
                <option value="nuble">XVI - Ñuble</option>
                <option value="biobio">VIII - Biobío</option>
                <option value="araucania">IX - Araucanía</option>
                <option value="los_rios">XIV - Los Ríos</option>
                <option value="los_lagos">X - Los Lagos</option>
                <option value="aysen">XI - Aysén</option>
                <option value="magallanes">XII - Magallanes</option>
            </select>

            <label class="seccion-titulo">Ciudad Específica</label>
            <select id="ciudad">
                <option value="" selected>Seleccione una ciudad</option>
            </select>

            <label class="seccion-titulo">Sector Económico</label>
            <select id="rubro">
                <option value="" selected disabled>-- Seleccione una opción --</option>
                <optgroup label="Minería y Energía">
                    <option value="mineria_cielo_abierto">Minería a Cielo Abierto</option>
                    <option value="mineria_subterranea">Minería Subterránea</option>
                    <option value="mineria_salares">Minería No Metálica / Salares</option>
                    <option value="energias_renovables">Energías Renovables</option>
                    <option value="petroleo_gas">Petróleo y Gas</option>
                </optgroup>
                <optgroup label="Construcción e Infraestructura">
                    <option value="edificacion_altura">Edificación en Altura</option>
                    <option value="obras_civiles">Obras Civiles</option>
                    <option value="montaje_industrial">Montaje Industrial</option>
                </optgroup>
                <optgroup label="Industria y Laboratorios">
                    <option value="laboratorio_quimico">Laboratorio Químico y Muestrera</option>
                    <option value="agroindustria_pesca">Agroindustria y Pesca</option>
                    <option value="forestal_madera">Forestal y Madera</option>
                    <option value="manufactura_consumo">Manufactura de Consumo</option>
                </optgroup>
                <optgroup label="Logística y Transporte">
                    <option value="puertos_maritimos">Puertos y Terminales</option>
                    <option value="transporte_terrestre">Transporte de Carga</option>
                    <option value="centros_distribucion">Centros de Distribución</option>
                </optgroup>
                <optgroup label="Servicios y Retail">
                    <option value="comercio_retail">Comercio Retail</option>
                    <option value="salud_educacion">Salud y Educación</option>
                    <option value="turismo_gastronomia">Turismo y Gastronomía</option>
                </optgroup>
            </select>

            <label class="seccion-titulo">Sector Institucional</label>
            <select id="sector">
                <option value="" selected disabled>-- Seleccione una opción --</option>
                <option value="privado">Privada</option>
                <option value="publico">Pública</option>
            </select>

            <label class="seccion-titulo">Tipo de Contrato</label>
            <div style="display: flex; align-items: center; gap: 8px;">
                <select id="tipo_contrato" style="flex: 1; margin-bottom: 0;">
                    <option value="" selected disabled>-- Seleccione una opción --</option>
                    <option value="indefinido">Contrato Indefinido</option>
                    <option value="plazo_fijo">Contrato a Plazo Fijo</option>
                    <option value="obra_faena">Contrato por Obra o Faena</option>
                    <option value="tiempo_parcial">Contrato a Tiempo Parcial</option>
                    <option value="teletrabajo">Contrato de Teletrabajo</option>
                    <option value="temporada">Contrato de Temporada</option>
                    <option value="honorarios">Contrato de Prestación de Servicios</option>
                </select>
                <span id="info_contrato" title="Información del contrato" style="cursor: help; font-size: 1.4rem;">ℹ️</span>
            </div>

            <label class="seccion-titulo">Duración del Servicio a Prestar</label>
            <div class="input-group-duracion">
                <input type="number" id="cantidad_duracion" value="1" min="1" placeholder="N°">
                <select id="unidad_duracion">
                    <option value="indefinida" selected>Indefinida (Contrato mensual normal)</option>
                    <option value="horas">Hora(s)</option>
                    <option value="dias">Día(s)</option>
                    <option value="semanas">Semana(s)</option>
                    <option value="meses">Mes(es)</option>
                    <option value="anos">Año(s)</option>
                </select>
            </div>
            <p style="font-size: 0.72rem; color: #7f8c8d; margin: 2px 0 0 0;"><i>*Si eliges meses/años, se sugerirá el valor por 1 mes.</i></p>

            <label class="seccion-titulo">Jornada y Turnos</label>
            <select id="turno">
                <option value="" selected disabled>-- Seleccione una opción --</option>
                <option value="lunes_viernes_normal">Lunes a Viernes (Horario Normal)</option>
                <option value="lunes_viernes_art22">Lunes a Viernes (Art. 22)</option>
                <option value="turno_dia_noche">Turno Día y Noche</option>
                <option value="un_dia_semana">1 día a la semana</option>
                <option value="turno_4x3">Turno 4x3</option>
                <option value="turno_nocturno">Turno Nocturno Fijo</option>
                <option value="turno_7x7">Turno 7x7 (Faena)</option>
                <option value="turno_14x14">Turno 14x14 (Faena Extrema)</option>
                <option value="otra_excepcional">Otra jornada excepcional</option>
            </select>

            <label class="seccion-titulo">Modalidad y Dotación</label>
            <select id="modalidad">
                <option value="" selected disabled>-- Modalidad de Trabajo --</option>
                <option value="oficina">100% Oficina / Administrativo</option>
                <option value="mixto">Mixto (Oficina y Terreno)</option>
                <option value="terreno">100% Terreno / Faena</option>
            </select>
            <select id="trabajadores_cargo" style="margin-top: 5px;">
                <option value="" selected disabled>-- Trabajadores Expuestos --</option>
                <option value="t_1_9">1 a 9 trabajadores</option>
                <option value="t_10_49">10 a 49 trabajadores</option>
                <option value="t_50_199">50 a 199 trabajadores</option>
                <option value="t_200_mas">200 o más trabajadores</option>
            </select>

            <label class="seccion-titulo" style="color: #2c3e50; margin-top: 20px;">Marca si alguna de estas funciones se mencionan en la oferta laboral o entrevista.</label>
            <div class="banderas-box" style="background: #f0f8ff; padding: 12px 15px; border-radius: 6px; border: 2px solid #2980b9; font-size: 0.85rem;">
                <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="tarea_bodega" style="width: auto; margin: 0;"><label for="tarea_bodega" style="margin: 0; line-height: 1.1;">Administrar bodega o materiales</label></div>
                <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="tarea_rrhh" style="width: auto; margin: 0;"><label for="tarea_rrhh" style="margin: 0; line-height: 1.1;">Control de asistencia o remuneraciones</label></div>
                <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="tarea_logistica" style="width: auto; margin: 0;"><label for="tarea_logistica" style="margin: 0; line-height: 1.1;">Coordinación logística o despachos</label></div>
                <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="tarea_contabilidad" style="width: auto; margin: 0;"><label for="tarea_contabilidad" style="margin: 0; line-height: 1.1;">Funciones contables o de finanzas</label></div>
                <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="tarea_conduccion" style="width: auto; margin: 0;"><label for="tarea_conduccion" style="margin: 0; line-height: 1.1;">Conducción de vehículos empresa</label></div>
                <div style="margin-bottom: 0px; display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="tarea_supervision_op" style="width: auto; margin: 0;"><label for="tarea_supervision_op" style="margin: 0; line-height: 1.1;">Supervisión de la operación</label></div>
            </div>

            <button type="button" class="btn-principal" style="width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1.1rem; margin-top: 25px; cursor: pointer;" onclick="evaluarOferta()">Analizar Oferta</button>

            <button type="button" style="width: 100%; padding: 12px; background: #e8f4fd; color: #2980b9; border: 1px solid #2980b9; border-radius: 6px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer;" onclick="toggleMapa()">
                🗺️ Ver mapa de ofertas analizadas
            </button>
            <div id="contenedor_mapa" style="display: none; margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1.5px solid #d0e1f0;">
                <div id="mapa-radar" style="height: 350px; width: 100%;"></div>
            </div>

        </main>

        <section id="resultado_analisis" class="hidden"></section>

        <footer class="footer" style="text-align: center; font-size: 0.8rem; color: #7f8c8d; margin-top: 30px;">
            <p>Datos basados en MiFuturo.cl, Ine.gob.cl y Normativa Chilena</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_client.js.obfuscated.js"></script>
    <script src="app.js.obfuscated.js"></script>
    <script src="mapa.js.obfuscated.js"></script>
</body>
</html>
